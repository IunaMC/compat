name: Release

# Runs when a tag vX.Y.Z (stable, only from a main commit) or vX.Y.Z-beta.N (only from a
# devel/devel commit) is pushed. The tag must be annotated and signed (GitHub: "verified"), and
# its version must match gradle.properties. The jar is published on the release with the SHA-256
# and GitHub's provenance attestation (Sigstore signature of the build).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag
        id: tag
        run: |
          tag="$GITHUB_REF_NAME"
          versao="${tag#v}"
          if ! [[ "$versao" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$tag' is neither vX.Y.Z nor vX.Y.Z-beta.N."
            exit 1
          fi
          if [[ "$(sed -n 's/^mod_version=//p' gradle.properties)" != "$versao" ]]; then
            echo "::error::Tag $tag does not match mod_version in gradle.properties."
            exit 1
          fi

          # Annotated tag verified by GitHub (GPG or SSH signature of the person who created it).
          tipo="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.type)"
          if [[ "$tipo" != tag ]]; then
            echo "::error::Tag $tag is lightweight. Create it with: git tag -s $tag -m ..."
            exit 1
          fi
          objeto="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)"
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$objeto" --jq .verification.verified)" != true ]]; then
            echo "::error::Tag $tag is not signed, or GitHub does not recognize the signature."
            exit 1
          fi

          # Stable only from main, beta only from devel/devel.
          if [[ "$versao" == *-* ]]; then
            origem=origin/devel/devel
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          else
            origem=origin/main
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$origem"; then
            echo "::error::The commit of tag $tag is not on ${origem#origin/}."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists."
            exit 1
          fi
          echo "versao=$versao" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Assemble the release files
        id: arquivos
        run: |
          jar="$(ls build/libs/iunacompat-*-mc*.jar)"
          (cd build/libs && sha256sum "$(basename "$jar")" > "$(basename "$jar").sha256")
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          awk -v v="${{ steps.tag.outputs.versao }}" '
            $0 ~ "^## " { emit = ($2 == v); next }
            emit { print }' CHANGELOG.md > "$RUNNER_TEMP/notas.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notas.md"; then
            echo "::error file=CHANGELOG.md::Section '## ${{ steps.tag.outputs.versao }}' is empty or missing."
            exit 1
          fi
          cat "$RUNNER_TEMP/notas.md"

      - name: Attest the jar's provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.arquivos.outputs.jar }}

      - name: Create the release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.arquivos.outputs.jar }}" "${{ steps.arquivos.outputs.jar }}.sha256" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notas.md" \
            ${{ steps.tag.outputs.prerelease }}
