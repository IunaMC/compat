name: Validar

# Compila o mod, executa os testes unitários e o teste de contrato e confere a versão. O teste de
# integração, que sobe o servidor do pack, fica no workflow Integração, para que uma mudança
# pequena não precise baixar 1,5 GB de mods.
on:
  push:
    branches: [main, devel/**]
    paths-ignore: ["**/*.md", docs/**]
  pull_request:
    paths-ignore: ["**/*.md", docs/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: Compilar e testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # O jar do wrapper é executado na máquina de quem compila, por isso o hash dele é conferido com a lista oficial.
      - uses: gradle/actions/wrapper-validation@v6

      - name: Conferir a versão
        run: |
          versao="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if ! [[ "$versao" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=gradle.properties::Versão inválida: '$versao' (o esperado é algo como 1.2.3 ou 1.2.3-beta.1)"
            exit 1
          fi
          if ! grep -qE "^## ${versao//./\\.}( |$)" MUDANCAS.md; then
            echo "::error file=MUDANCAS.md::Falta a seção '## $versao' no MUDANCAS.md"
            exit 1
          fi

      - name: Compilar e testar
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: iunacompat
          path: build/libs/iunacompat-*-mc*.jar
          retention-days: 14

      - name: Relatório dos testes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-dos-testes
          path: build/reports/tests
          retention-days: 7

  entrada-na-main:
    name: Entrada na main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Conferir a branch de origem e a versão
        env:
          ORIGEM: ${{ github.head_ref }}
        run: |
          if [[ "$ORIGEM" != devel/devel && "$ORIGEM" != docs/* ]]; then
            echo "::error::A main só aceita PRs da devel/devel ou de docs/*, e este vem de '$ORIGEM'."
            exit 1
          fi
          nova="$(sed -n 's/^mod_version=//p' gradle.properties)"
          antiga="$(git show origin/main:gradle.properties | sed -n 's/^mod_version=//p')"
          if [[ "$nova" == *-* ]]; then
            echo "::error file=gradle.properties::A main só aceita versões estáveis, e '$nova' é beta."
            exit 1
          fi
          if ! git diff --quiet origin/main HEAD -- src build.gradle gradle.properties settings.gradle scripts/integration; then
            if [[ "$nova" == "$antiga" ]]; then
              echo "::error file=gradle.properties::O código mudou, mas a versão continua $antiga. Aumente o mod_version e escreva o MUDANCAS.md."
              exit 1
            fi
            if [[ "$(printf '%s\n%s\n' "$antiga" "$nova" | sort -V | tail -1)" != "$nova" ]]; then
              echo "::error file=gradle.properties::A versão $nova é menor que a da main ($antiga)."
              exit 1
            fi
          fi
          echo "Origem $ORIGEM, versão $antiga -> $nova"
