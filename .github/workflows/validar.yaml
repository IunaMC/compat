name: Validar

# Builds, runs the unit tests and the contract test, and checks the version. The integration
# test (which starts the pack's server) lives in the Integração workflow, so that a small change
# does not download 1.5 GB of mods.
on:
  push:
    branches: [main, devel/**]
    paths-ignore: ["**/*.md", docs/**]
  pull_request:
    paths-ignore: ["**/*.md", docs/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: Compilar e testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The wrapper jar runs on the builder's machine: check its hash against the official list.
      - uses: gradle/actions/wrapper-validation@v6

      - name: Check the version
        run: |
          versao="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if ! [[ "$versao" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=gradle.properties::Invalid version: '$versao' (expected something like 1.2.3 or 1.2.3-beta.1)"
            exit 1
          fi
          if ! grep -qE "^## ${versao//./\\.}( |$)" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Missing section '## $versao' in CHANGELOG.md"
            exit 1
          fi

      - name: Build and test
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: iunacompat
          path: build/libs/iunacompat-*-mc*.jar
          retention-days: 14

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-dos-testes
          path: build/reports/tests
          retention-days: 7

  entrada-na-main:
    name: Entrada na main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check source branch and version
        env:
          ORIGEM: ${{ github.head_ref }}
        run: |
          if [[ "$ORIGEM" != devel/devel && "$ORIGEM" != docs/* ]]; then
            echo "::error::main only accepts PRs from devel/devel or docs/*, and this one comes from '$ORIGEM'."
            exit 1
          fi
          nova="$(sed -n 's/^mod_version=//p' gradle.properties)"
          antiga="$(git show origin/main:gradle.properties | sed -n 's/^mod_version=//p')"
          if [[ "$nova" == *-* ]]; then
            echo "::error file=gradle.properties::main only accepts stable versions, and '$nova' is a beta."
            exit 1
          fi
          if ! git diff --quiet origin/main HEAD -- src build.gradle gradle.properties settings.gradle scripts/integration; then
            if [[ "$nova" == "$antiga" ]]; then
              echo "::error file=gradle.properties::The code changed, but the version is still $antiga. Bump mod_version and write CHANGELOG.md."
              exit 1
            fi
            if [[ "$(printf '%s\n%s\n' "$antiga" "$nova" | sort -V | tail -1)" != "$nova" ]]; then
              echo "::error file=gradle.properties::Version $nova is lower than main's ($antiga)."
              exit 1
            fi
          fi
          echo "Source $ORIGEM, version $antiga -> $nova"
