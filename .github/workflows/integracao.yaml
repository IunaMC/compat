name: Integração

# Sobe o servidor real do pack IUNA (NeoForge, LuckPerms, Connector e os mods Fabric) com o jar
# recém-compilado e confere a ponte de ponta a ponta (scripts/integration-test.sh). Como baixa
# cerca de 1,5 GB de mods e leva alguns minutos, é executado nos PRs para a main, toda semana
# (para detectar mudanças no pack) e sob demanda.
on:
  pull_request:
    branches: [main]
    paths: [src/**, build.gradle, gradle.properties, scripts/integration/**, scripts/integration-test.sh, .github/workflows/integracao.yaml]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      pack:
        description: Branch ou tag do IunaMC/modpack a testar
        default: main

permissions:
  contents: read

concurrency:
  group: integracao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integracao:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Compilar o mod
        run: ./gradlew build --no-daemon -x test

      - name: Subir o servidor e conferir a ponte
        env:
          MEMORY: 5G
          PACK: ${{ inputs.pack || 'main' }}
        run: ./scripts/integration-test.sh --modpack-ref "$PACK"

      - name: Guardar o log do servidor
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-do-servidor
          path: |
            servidor-teste/server.log
            servidor-teste/server/logs/latest.log
          retention-days: 7
          if-no-files-found: ignore
