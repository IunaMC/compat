name: Integração

# Starts the real IUNA pack server (NeoForge, LuckPerms, Connector and the Fabric mods) with the
# freshly built jar and checks the bridge end to end (scripts/integration-test.sh). It downloads
# about 1.5 GB of mods and takes a few minutes, so it runs on PRs into main, every week (to catch
# pack changes) and on demand.
on:
  pull_request:
    branches: [main]
    paths: [src/**, build.gradle, gradle.properties, scripts/integration/**, scripts/integration-test.sh, .github/workflows/integracao.yaml]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      pack:
        description: IunaMC/modpack branch or tag to test
        default: main

permissions:
  contents: read

concurrency:
  group: integracao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integracao:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build the mod
        run: ./gradlew build --no-daemon -x test

      - name: Start the server and check the bridge
        env:
          MEMORY: 5G
          PACK: ${{ inputs.pack || 'main' }}
        run: ./scripts/integration-test.sh --modpack-ref "$PACK"

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: log-do-servidor
          path: |
            servidor-teste/server.log
            servidor-teste/server/logs/latest.log
          retention-days: 7
          if-no-files-found: ignore
