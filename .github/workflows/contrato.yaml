name: Contrato

# Alarme antecipado: a ponte lê a fabric-permissions-api por reflexão, então uma mudança nela
# não quebra o build. Toda semana este workflow confere (1) o formato da versão mais nova da API
# publicada e (2) se o pack mudou desde a última versão testada. Qualquer um dos dois abre uma
# issue.
on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  api:
    name: fabric-permissions-api publicada
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Testar o contrato com a versão do pack e a mais nova
        run: ./gradlew test --no-daemon --tests '*FabricContractTest*' -PcontractVersions=0.3.1,latest.release
      - name: Abrir issue se o contrato quebrou
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          titulo="contrato: a fabric-permissions-api mudou de formato"
          if [[ -z "$(gh issue list --state open --search "$titulo in:title" --json number --jq '.[0].number')" ]]; then
            gh issue create --title "$titulo" --body "O teste de contrato falhou com a versão mais nova publicada. Veja a execução: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Ajuste o adaptador (permissions/fabric) antes de o pack atualizar para essa versão."
          fi

  pack:
    name: Pack mudou desde o último teste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Comparar o pack com tested-with.json
        id: deriva
        continue-on-error: true
        run: python3 -I scripts/pack-drift.py | tee "$RUNNER_TEMP/deriva.txt"
      - name: Abrir issue se o pack mudou
        if: steps.deriva.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          titulo="pack: versões mudaram desde o último teste de integração"
          if [[ -z "$(gh issue list --state open --search "$titulo in:title" --json number --jq '.[0].number')" ]]; then
            gh issue create --title "$titulo" --body "$(cat "$RUNNER_TEMP/deriva.txt")"
          fi
