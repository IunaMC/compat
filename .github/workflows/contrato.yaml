name: Contrato

# Early warning: the bridge reads fabric-permissions-api through reflection, so a change in it
# does not break the build. Every week this workflow checks (1) the shape of the newest published
# API version and (2) whether the pack changed since the last tested version. Either one opens an
# issue.
on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  api:
    name: fabric-permissions-api publicada
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Test the contract with the pack's version and the newest one
        run: ./gradlew test --no-daemon --tests '*FabricContractTest*' -PcontractVersions=0.3.1,latest.release
      - name: Open an issue if the contract broke
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          titulo="contract: fabric-permissions-api changed shape"
          if [[ -z "$(gh issue list --state open --search "$titulo in:title" --json number --jq '.[0].number')" ]]; then
            gh issue create --title "$titulo" --body "The contract test failed with the newest published version. See the run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Adjust the adapter (permissions/fabric) before the pack updates to that version."
          fi

  pack:
    name: Pack mudou desde o último teste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the pack with tested-with.json
        id: deriva
        continue-on-error: true
        run: python3 -I scripts/pack-drift.py | tee "$RUNNER_TEMP/deriva.txt"
      - name: Open an issue if the pack changed
        if: steps.deriva.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          titulo="pack: versions changed since the last integration test"
          if [[ -z "$(gh issue list --state open --search "$titulo in:title" --json number --jq '.[0].number')" ]]; then
            gh issue create --title "$titulo" --body "$(cat "$RUNNER_TEMP/deriva.txt")"
          fi
