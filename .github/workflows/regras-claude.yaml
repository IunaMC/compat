name: Regras do Claude

# Checks that the common-rules block in CLAUDE.md matches the official text in
# IunaMC/docs (a public repository, so the raw download needs no token).
on:
  push:
    paths: [CLAUDE.md, .github/workflows/regras-claude.yaml]
  pull_request:
    paths: [CLAUDE.md, .github/workflows/regras-claude.yaml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regras-claude-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regras-claude:
    name: Regras do Claude
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download the official text and the script
        run: |
          base=https://raw.githubusercontent.com/IunaMC/docs/main
          mkdir "$RUNNER_TEMP/oficial"
          curl -fsSL "$base/referencia/claude.md" -o "$RUNNER_TEMP/oficial/claude.md"
          curl -fsSL "$base/scripts/regras-comuns.py" -o "$RUNNER_TEMP/oficial/regras-comuns.py"

      - name: Check the CLAUDE.md block
        run: python3 "$RUNNER_TEMP/oficial/regras-comuns.py" --fonte "$RUNNER_TEMP/oficial/claude.md" conferir
