org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_id=iunacompat
mod_name=IUNA Compat
mod_version=0.1.0
mod_license=MIT
mod_authors=IunaMC
mod_description=Server-side compatibility layer for the IUNA modpack. The first module bridges the fabric-permissions-api (used by Fabric mods running through Sinytra Connector) to LuckPerms.
mod_url=https://github.com/IunaMC/compat

# Target platform
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.253
neo_version_range=[21.1.0,22)
loader_version_range=[4,)

# Optional runtime dependency (compile-only API; the API is backwards compatible)
luckperms_api_version=5.4

# Test dependencies
junit_version=5.13.4
mockito_version=5.24.0
asm_version=9.9

# fabric-permissions-api versions the contract test checks (the pack embeds 0.3.1)
contract_versions=0.3.1
